<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4effa">
  <title>Food Location | Find a table nearby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #202822;
      --muted: #727b73;
      --line: #e9e2f0;
      --paper: #f4effa;
      --surface: #fff;
      --purple: #3b1d5a;
      --purple-soft: #eee5f7;
      --orange: #ed7445;
      --yellow: #f1b943;
      font-family: "DM Sans", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { min-height: 100vh; }
    .topbar {
      height: 72px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 max(28px, calc((100vw - 1120px) / 2)); background: rgba(255,255,255,.88);
      border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; backdrop-filter: blur(16px);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; font: 800 19px "Manrope", sans-serif; letter-spacing: -.5px; text-decoration: none; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; color: white; background: var(--purple); }
    .brand-mark svg { width: 21px; height: 21px; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .saved-link, .location-button { border: 0; background: transparent; font-weight: 600; cursor: pointer; }
    .saved-link { padding: 9px 12px; border-radius: 10px; }
    .saved-link:hover { background: var(--paper); }
    .avatar { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: #f6d6c6; color: #804831; font-weight: 700; }
    main { width: min(100% - 40px, 1000px); margin: 0 auto; padding: 48px 0 72px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
    .eyebrow { margin: 0 0 9px; color: var(--purple); font-size: 12px; font-weight: 700; letter-spacing: 1.35px; text-transform: uppercase; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font: 800 clamp(30px, 5vw, 42px)/1.1 "Manrope", sans-serif; letter-spacing: -1.5px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 15px; }
    .location-button { display: flex; align-items: center; gap: 9px; padding: 11px 14px; background: white; border: 1px solid var(--line); border-radius: 12px; white-space: nowrap; }
    .location-button:hover { border-color: #c6b2d8; }
    .pin { width: 18px; height: 18px; color: var(--orange); }
    .search-wrap { position: relative; margin-bottom: 23px; }
    .search-icon { position: absolute; left: 17px; top: 50%; width: 20px; height: 20px; color: #89918a; transform: translateY(-50%); pointer-events: none; }
    .search { width: 100%; height: 56px; padding: 0 18px 0 48px; color: var(--ink); background: white; border: 1px solid var(--line); border-radius: 14px; outline: none; box-shadow: 0 3px 12px #233c2810; }
    .search:focus { border-color: #9f80b9; box-shadow: 0 0 0 3px #3b1d5a18; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 21px; }
    .filters { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter { flex: 0 0 auto; padding: 9px 14px; border: 1px solid var(--line); border-radius: 99px; background: white; color: #59625b; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .16s, color .16s, border-color .16s; }
    .filter:hover { border-color: #c6b2d8; }
    .filter.active { border-color: var(--purple); color: white; background: var(--purple); }
    .sort { display: flex; gap: 3px; padding: 4px; border: 1px solid var(--line); border-radius: 11px; background: #fff; white-space: nowrap; }
    .sort button { padding: 7px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
    .sort button.active { color: var(--ink); background: var(--paper); }
    .results-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 13px; }
    .results-head h2 { margin: 0; font: 700 17px "Manrope", sans-serif; }
    .results-count { color: var(--muted); font-size: 13px; }
    .restaurant-list { display: grid; gap: 13px; }
    .restaurant { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: 164px; overflow: hidden; background: white; border: 1px solid #eceee9; border-radius: 14px; animation: arrive .42s both; }
    .restaurant:nth-child(2) { animation-delay: .05s; }
    .restaurant:nth-child(3) { animation-delay: .1s; }
    .restaurant:nth-child(4) { animation-delay: .15s; }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .photo-wrap { position: relative; min-height: 164px; background: #e7e8dc; }
    .photo { width: 100%; height: 100%; min-height: 164px; object-fit: cover; display: block; }
    .open-label { position: absolute; left: 11px; bottom: 11px; padding: 6px 9px; border-radius: 7px; color: #22543a; background: #fff; font-size: 11px; font-weight: 700; box-shadow: 0 2px 8px #14231920; }
    .restaurant-info { min-width: 0; padding: 17px 18px 15px 20px; }
    .name-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .restaurant h3 { margin: 0 0 5px; overflow: hidden; font: 700 17px "Manrope", sans-serif; text-overflow: ellipsis; white-space: nowrap; }
    .cuisine { margin: 0; color: var(--muted); font-size: 13px; }
    .heart { flex: 0 0 40px; width: 40px; height: 40px; display: grid; place-items: center; margin: -4px -5px 0 0; border: 0; border-radius: 50%; color: #828b83; background: transparent; font-size: 20px; cursor: pointer; }
    .heart:hover { background: #fdf0ec; color: var(--orange); }
    .heart.saved { color: #df654f; }
    .rating-row { display: flex; align-items: center; gap: 7px; margin: 13px 0 12px; font-size: 12px; }
    .rating { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
    .star { color: var(--yellow); font-size: 15px; }
    .review-count { color: var(--muted); }
    button.review-count { min-height: 36px; padding: 0 2px; border: 0; background: transparent; font-size: inherit; cursor: pointer; }
    button.review-count:hover { color: var(--purple); text-decoration: underline; }
    .dot { color: #bbc1ba; }
    .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #f0f1ed; padding-top: 11px; color: #626c64; font-size: 12px; }
    .distance { display: inline-flex; align-items: center; gap: 5px; }
    .price { font-weight: 600; }
    .empty { padding: 42px 20px; text-align: center; color: var(--muted); background: white; border: 1px solid var(--line); border-radius: 14px; }
    .empty strong { display: block; margin-bottom: 6px; color: var(--ink); font: 700 16px "Manrope", sans-serif; }
    .review-dialog { width: min(520px, calc(100% - 28px)); max-height: min(80vh, 620px); padding: 24px; border: 1px solid var(--line); border-radius: 16px; color: var(--ink); background: white; box-shadow: 0 24px 80px #17271b35; }
    .review-dialog::backdrop { background: #19251dcc; backdrop-filter: blur(3px); }
    .review-dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .review-dialog-head .eyebrow { margin-bottom: 6px; }
    .review-dialog-head h2 { margin: 0; font: 700 21px "Manrope", sans-serif; }
    .dialog-close { padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; background: white; font-size: 12px; font-weight: 600; cursor: pointer; }
    .dialog-rating { display: flex; align-items: center; gap: 7px; padding: 16px 0; font-size: 13px; }
    .review-entry { padding: 14px 0; border-top: 1px solid #f0f1ed; }
    .review-entry:first-child { border-top: 0; }
    .review-entry-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 7px; font-size: 13px; }
    .review-entry-head strong { font-weight: 700; }
    .review-entry-head time { color: var(--muted); }
    .review-entry p { margin: 0; color: #58635b; font-size: 13px; line-height: 1.55; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 10; padding: 12px 17px; color: white; background: #26362b; border-radius: 10px; box-shadow: 0 8px 24px #14231930; font-size: 13px; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity .2s, transform .2s; }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .assistant-launcher { position: fixed; right: 24px; bottom: 24px; z-index: 12; width: 58px; height: 58px; display: grid; place-items: center; border: 0; border-radius: 50%; color: white; background: var(--purple); box-shadow: 0 8px 24px #3b1d5a45; cursor: pointer; transition: transform .18s, background .18s; }
    .assistant-launcher:hover { background: #512779; transform: translateY(-2px); }
    .assistant-launcher svg { width: 25px; height: 25px; }
    .assistant-panel { position: fixed; right: 24px; bottom: 94px; z-index: 12; width: min(360px, calc(100vw - 32px)); overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: white; box-shadow: 0 18px 54px #24133430; }
    .assistant-panel[hidden] { display: none; }
    .assistant-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 17px; color: white; background: var(--purple); }
    .assistant-title { margin: 0; font: 700 15px "Manrope", sans-serif; }
    .assistant-status { margin: 3px 0 0; color: #e4d5f1; font-size: 11px; }
    .assistant-close { width: 34px; height: 34px; border: 0; border-radius: 50%; color: white; background: #ffffff20; font-size: 20px; cursor: pointer; }
    .assistant-messages { min-height: 120px; max-height: min(340px, 45vh); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding: 15px; }
    .assistant-message { max-width: 88%; margin: 0; padding: 10px 12px; border-radius: 13px; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
    .assistant-message.agent { align-self: flex-start; color: var(--ink); background: var(--paper); border-bottom-left-radius: 4px; }
    .assistant-message.user { align-self: flex-end; color: white; background: var(--purple); border-bottom-right-radius: 4px; }
    .assistant-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
    .assistant-input { min-width: 0; flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; outline: none; font-size: 13px; }
    .assistant-input:focus { border-color: #9f80b9; box-shadow: 0 0 0 3px #3b1d5a18; }
    .assistant-send { padding: 0 14px; border: 0; border-radius: 10px; color: white; background: var(--purple); font-size: 13px; font-weight: 700; cursor: pointer; }
    @media (max-width: 650px) {
      .topbar { height: 62px; padding: 0 18px; }
      .brand { font-size: 17px; }
      .brand-mark { width: 31px; height: 31px; }
      .saved-link { padding: 8px; font-size: 13px; }
      .avatar { width: 32px; height: 32px; }
      main { width: min(100% - 32px, 480px); padding: 32px 0 48px; }
      .intro { align-items: flex-start; flex-direction: column; gap: 17px; margin-bottom: 21px; }
      h1 { font-size: 32px; }
      .location-button { padding: 9px 12px; font-size: 13px; }
      .toolbar { align-items: flex-start; flex-direction: column; gap: 12px; }
      .filters { width: 100%; }
      .sort { align-self: flex-end; }
      .filter { min-height: 40px; }
      .sort button { min-height: 36px; }
      .saved-link { min-height: 40px; }
      .restaurant { grid-template-columns: 112px minmax(0, 1fr); min-height: 150px; }
      .photo-wrap, .photo { min-height: 150px; }
      .restaurant-info { padding: 13px 12px 11px; }
      .name-row > div { min-width: 0; }
      .restaurant h3 { font-size: 15px; }
      .cuisine { font-size: 12px; }
      .rating-row { gap: 5px; margin: 10px 0; font-size: 11px; }
      .meta-row { font-size: 11px; }
      .open-label { left: 7px; bottom: 7px; padding: 5px 7px; font-size: 10px; }
      .assistant-launcher { right: 16px; bottom: 16px; }
      .assistant-panel { right: 16px; bottom: 86px; }
    }
    @media (max-width: 370px) {
      main { width: calc(100% - 24px); }
      .topbar { padding: 0 12px; }
      .restaurant { grid-template-columns: 92px minmax(0, 1fr); }
      .restaurant-info { padding-left: 10px; padding-right: 9px; }
      .review-count { font-size: 10px; }
      .restaurant-info { overflow: hidden; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Food Location home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.3"/><path d="M12 3V1M18 5l1.4-1.4"/></svg></span>
        <span>food location</span>
      </a>
      <div class="top-actions">
        <button class="saved-link" id="savedToggle" type="button">Saved <span id="savedCount">0</span></button>
        <span class="avatar" aria-label="Guest profile">G</span>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Good food, close by</p>
          <h1 id="page-title">Find your next favorite.</h1>
          <p class="subtitle">Local spots, honest reviews, and something delicious.</p>
        </div>
        <button class="location-button" id="locationButton" type="button">
          <svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span id="locationLabel">San Francisco, CA</span>
          <span aria-hidden="true">⌄</span>
        </button>
      </section>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4 4"/></svg>
        <input class="search" id="searchInput" type="search" placeholder="Search restaurants, cuisines, dishes..." aria-label="Search restaurants, cuisines, and dishes">
      </div>

      <div class="toolbar">
        <nav class="filters" id="filters" aria-label="Filter by cuisine">
          <button class="filter active" data-category="All" type="button">All places</button>
          <button class="filter" data-category="Cafe" type="button">Cafe</button>
          <button class="filter" data-category="Fast food" type="button">Fast food</button>
          <button class="filter" data-category="Asian" type="button">Asian</button>
          <button class="filter" data-category="Italian" type="button">Italian</button>
          <button class="filter" data-category="Mexican" type="button">Mexican</button>
        </nav>
        <div class="sort" aria-label="Sort restaurants">
          <button class="active" data-sort="nearby" type="button">Nearby</button>
          <button data-sort="rating" type="button">Top rated</button>
        </div>
      </div>

      <section aria-labelledby="resultsTitle">
        <div class="results-head">
          <h2 id="resultsTitle">Places around you</h2>
          <span class="results-count" id="resultsCount" aria-live="polite"></span>
        </div>
        <div class="restaurant-list" id="restaurantList"></div>
      </section>
    </main>
  </div>
  <dialog class="review-dialog" id="reviewDialog" aria-labelledby="reviewTitle">
    <div class="review-dialog-head">
      <div><p class="eyebrow">Community reviews</p><h2 id="reviewTitle"></h2></div>
      <button class="dialog-close" id="closeReviews" type="button">Close</button>
    </div>
    <div id="reviewContent"></div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <section class="assistant-panel" id="assistantPanel" aria-label="Food assistant chat" hidden>
    <div class="assistant-head">
      <div><p class="assistant-title">Food assistant</p><p class="assistant-status">Demo assistant · restaurant tips</p></div>
      <button class="assistant-close" id="assistantClose" type="button" aria-label="Close chat">×</button>
    </div>
    <div class="assistant-messages" id="assistantMessages" role="log" aria-live="polite" aria-relevant="additions">
      <p class="assistant-message agent">Hi! Ask me about nearby places, top-rated spots, cuisines, or prices.</p>
    </div>
    <form class="assistant-form" id="assistantForm">
      <input class="assistant-input" id="assistantInput" type="text" placeholder="Ask about a place..." aria-label="Ask the food assistant" autocomplete="off" required>
      <button class="assistant-send" type="submit">Send</button>
    </form>
  </section>
  <button class="assistant-launcher" id="assistantLauncher" type="button" aria-label="Open food assistant chat" aria-controls="assistantPanel" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5 8 8 0 0 1-3.4-.75L4 20l1.3-4.05A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8.5 11.5h.01M12.5 11.5h.01M16.5 11.5h.01"/></svg>
  </button>

  <script>
    const places = [
      { id: 1, name: "Juniper & Rye", category: "Cafe", cuisine: "Cafe · Brunch · Bakery", rating: 4.8, reviews: 328, price: "$$", distance: 0.4, lat: 37.7798, lon: -122.4145, image: "photo-1554118811-1e0d58224f24", alt: "Sunlit cafe counter with a fresh cup of coffee", keywords: "coffee pastry avocado toast brunch", quotes: [{ author: "Maya R.", date: "2 days ago", text: "The coffee is excellent and the ricotta toast was the perfect slow-morning breakfast." }, { author: "Chris L.", date: "1 week ago", text: "Bright, friendly spot. Get there early for a seat by the window." }] },
      { id: 2, name: "Little Seoul Kitchen", category: "Asian", cuisine: "Korean · Bowls · Comfort food", rating: 4.7, reviews: 214, price: "$$", distance: 0.8, lat: 37.7738, lon: -122.4194, image: "photo-1552566626-52f8b828add9", alt: "Warm, welcoming neighborhood restaurant", keywords: "bibimbap korean noodles rice", quotes: [{ author: "Jamie K.", date: "3 days ago", text: "Generous portions and a lovely crispy rice bowl. The kimchi is a must." }, { author: "Alex P.", date: "2 weeks ago", text: "Quick lunch, warm service, and everything tasted freshly made." }] },
      { id: 3, name: "Golden Gate Burgers", category: "Fast food", cuisine: "Burgers · Fries · Shakes", rating: 4.6, reviews: 491, price: "$", distance: 1.1, lat: 37.7864, lon: -122.4081, image: "photo-1568901346375-23c9450c58cd", alt: "Stacked cheeseburger with crisp lettuce", keywords: "burger cheeseburger fries fast food", quotes: [{ author: "Taylor M.", date: "Yesterday", text: "Classic burger done right. The fries stayed crispy all the way home." }, { author: "Sam D.", date: "5 days ago", text: "Fast counter service and good value for a filling lunch." }] },
      { id: 4, name: "Sorella Trattoria", category: "Italian", cuisine: "Italian · Pasta · Wood-fired", rating: 4.9, reviews: 176, price: "$$$", distance: 1.6, lat: 37.7699, lon: -122.4261, image: "photo-1555396273-367ea4eb4db5", alt: "Cozy restaurant dining room ready for dinner", keywords: "pasta pizza italian trattoria", quotes: [{ author: "Nina B.", date: "4 days ago", text: "The wood-fired pasta special was beautiful, and the staff made us feel at home." }, { author: "Jordan W.", date: "2 weeks ago", text: "A little neighborhood gem. Save room for dessert." }] },
      { id: 5, name: "Taco Garden", category: "Mexican", cuisine: "Mexican · Tacos · Fresh salsa", rating: 4.5, reviews: 263, price: "$", distance: 2.1, lat: 37.7902, lon: -122.4168, image: "photo-1552332386-f8dd00dc2f85", alt: "Colorful tacos topped with fresh ingredients", keywords: "taco burrito mexican salsa", quotes: [{ author: "Morgan S.", date: "1 day ago", text: "Fresh salsa, quick service, and the grilled veggie tacos are fantastic." }, { author: "Riley T.", date: "6 days ago", text: "Great casual stop after work. The house agua fresca is a nice touch." }] }
    ];
    let activeCategory = "All";
    let sortBy = "nearby";
    let searchTerm = "";
    let savedOnly = false;
    let origin = { lat: 37.7749, lon: -122.4194 };
    const saved = new Set();
    const list = document.querySelector("#restaurantList");
    const toast = document.querySelector("#toast");
    let toastTimer;

    function distanceBetween(a, b) {
      const radians = value => value * Math.PI / 180;
      const latDiff = radians(b.lat - a.lat);
      const lonDiff = radians(b.lon - a.lon);
      const value = Math.sin(latDiff / 2) ** 2 + Math.cos(radians(a.lat)) * Math.cos(radians(b.lat)) * Math.sin(lonDiff / 2) ** 2;
      return 3958.8 * 2 * Math.atan2(Math.sqrt(value), Math.sqrt(1 - value));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("visible"), 2400);
    }

    function getAssistantReply(question) {
      const query = question.toLowerCase();
      const closest = [...places].sort((a, b) => distanceBetween(origin, a) - distanceBetween(origin, b))[0];
      const topRated = [...places].sort((a, b) => b.rating - a.rating)[0];
      const mentionedPlace = places.find(place => query.includes(place.name.toLowerCase()));

      if (mentionedPlace) {
        return `${mentionedPlace.name} serves ${mentionedPlace.cuisine.toLowerCase()}, is rated ${mentionedPlace.rating.toFixed(1)} stars, and costs ${mentionedPlace.price}.`;
      }
      if (/near|closest|nearby|distance/.test(query)) {
        return `${closest.name} is the closest listed spot, about ${distanceBetween(origin, closest).toFixed(1)} miles away.`;
      }
      if (/best|top|highest|rating|rated/.test(query)) {
        return `${topRated.name} is the top-rated place at ${topRated.rating.toFixed(1)} stars. It serves ${topRated.cuisine.toLowerCase()}.`;
      }
      if (/cheap|budget|price|cost|inexpensive/.test(query)) {
        const budgetPicks = places.filter(place => place.price === "$").map(place => place.name).join(" and ");
        return `${budgetPicks} are the most budget-friendly options listed ($-priced).`;
      }
      if (/open|hours|closing/.test(query)) {
        return "All the places currently listed are marked open now.";
      }
      if (/save|saved|favorite/.test(query)) {
        return saved.size ? `You have ${saved.size} saved ${saved.size === 1 ? "place" : "places"}. Open Saved in the top bar to see them.` : "You haven't saved any places yet. Tap the heart on a restaurant to save it.";
      }
      const cuisineMatches = places.filter(place => `${place.category} ${place.cuisine} ${place.keywords}`.toLowerCase().split(/[\s·]+/).some(word => word.length > 2 && query.includes(word)));
      if (cuisineMatches.length) {
        return `You might like ${cuisineMatches.slice(0, 3).map(place => `${place.name} (${place.cuisine.toLowerCase()})`).join(", ")}.`;
      }
      return "I can help with nearby restaurants, top-rated picks, cuisines, prices, and your saved places. What are you looking for?";
    }

    function addAssistantMessage(message, sender) {
      const element = document.createElement("p");
      element.className = `assistant-message ${sender}`;
      element.textContent = message;
      document.querySelector("#assistantMessages").append(element);
      element.scrollIntoView({ block: "nearest" });
    }

    document.querySelector("#assistantLauncher").addEventListener("click", () => {
      document.querySelector("#assistantPanel").hidden = false;
      document.querySelector("#assistantLauncher").setAttribute("aria-expanded", "true");
      document.querySelector("#assistantInput").focus();
    });

    document.querySelector("#assistantClose").addEventListener("click", () => {
      document.querySelector("#assistantPanel").hidden = true;
      document.querySelector("#assistantLauncher").setAttribute("aria-expanded", "false");
      document.querySelector("#assistantLauncher").focus();
    });

    document.querySelector("#assistantForm").addEventListener("submit", event => {
      event.preventDefault();
      const input = document.querySelector("#assistantInput");
      const question = input.value.trim();
      if (!question) return;
      addAssistantMessage(question, "user");
      addAssistantMessage(getAssistantReply(question), "agent");
      input.value = "";
      input.focus();
    });

    function render() {
      const filtered = places
        .map(place => ({ ...place, currentDistance: distanceBetween(origin, place) }))
        .filter(place => (activeCategory === "All" || place.category === activeCategory))
        .filter(place => !savedOnly || saved.has(place.id))
        .filter(place => `${place.name} ${place.category} ${place.cuisine} ${place.keywords}`.toLowerCase().includes(searchTerm))
        .sort((a, b) => sortBy === "rating" ? b.rating - a.rating : a.currentDistance - b.currentDistance);

      document.querySelector("#resultsTitle").textContent = savedOnly ? "Your saved places" : "Places around you";
      document.querySelector("#resultsCount").textContent = `${filtered.length} ${filtered.length === 1 ? "place" : "places"}`;
      document.querySelector("#savedCount").textContent = saved.size;
      list.innerHTML = filtered.length ? filtered.map(place => `
        <article class="restaurant">
          <div class="photo-wrap">
            <img class="photo" src="https://images.unsplash.com/${place.image}?auto=format&fit=crop&w=500&q=80" alt="${place.alt}" loading="lazy">
            <span class="open-label">Open now</span>
          </div>
          <div class="restaurant-info">
            <div class="name-row">
              <div><h3>${place.name}</h3><p class="cuisine">${place.cuisine}</p></div>
              <button class="heart ${saved.has(place.id) ? "saved" : ""}" type="button" data-save="${place.id}" aria-label="${saved.has(place.id) ? "Remove" : "Save"} ${place.name}" aria-pressed="${saved.has(place.id)}">${saved.has(place.id) ? "♥" : "♡"}</button>
            </div>
            <div class="rating-row"><span class="rating"><span class="star" aria-hidden="true">★</span> ${place.rating.toFixed(1)}</span><span class="dot" aria-hidden="true">·</span><button class="review-count" type="button" data-reviews="${place.id}">${place.reviews} reviews</button></div>
            <div class="meta-row"><span class="distance">${place.currentDistance.toFixed(1)} mi away <span class="dot" aria-hidden="true">·</span> 20–30 min</span><span class="price">${place.price}</span></div>
          </div>
        </article>`).join("") : `<div class="empty"><strong>No places found</strong>Try a different search or filter.</div>`;
    }

    document.querySelector("#filters").addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      activeCategory = button.dataset.category;
      document.querySelectorAll(".filter").forEach(filter => filter.classList.toggle("active", filter === button));
      render();
    });

    document.querySelector(".sort").addEventListener("click", event => {
      const button = event.target.closest("[data-sort]");
      if (!button) return;
      sortBy = button.dataset.sort;
      document.querySelectorAll(".sort button").forEach(option => option.classList.toggle("active", option === button));
      render();
    });

    document.querySelector("#searchInput").addEventListener("input", event => {
      searchTerm = event.target.value.trim().toLowerCase();
      render();
    });

    list.addEventListener("click", event => {
      const reviewButton = event.target.closest("[data-reviews]");
      if (reviewButton) {
        const place = places.find(item => item.id === Number(reviewButton.dataset.reviews));
        document.querySelector("#reviewTitle").textContent = place.name;
        document.querySelector("#reviewContent").innerHTML = `
          <div class="dialog-rating"><span class="rating"><span class="star" aria-hidden="true">★</span> ${place.rating.toFixed(1)}</span><span class="review-count">${place.reviews} reviews</span></div>
          ${place.quotes.map(review => `<article class="review-entry"><div class="review-entry-head"><strong>${review.author}</strong><time>${review.date}</time></div><p>${review.text}</p></article>`).join("")}`;
        document.querySelector("#reviewDialog").showModal();
        return;
      }
      const button = event.target.closest("[data-save]");
      if (!button) return;
      const id = Number(button.dataset.save);
      const place = places.find(item => item.id === id);
      if (saved.has(id)) {
        saved.delete(id);
        showToast(`${place.name} removed from saved places`);
      } else {
        saved.add(id);
        showToast(`${place.name} saved for later`);
      }
      render();
    });

    document.querySelector("#closeReviews").addEventListener("click", () => document.querySelector("#reviewDialog").close());

    document.querySelector("#savedToggle").addEventListener("click", () => {
      savedOnly = !savedOnly;
      document.querySelector("#savedToggle").setAttribute("aria-pressed", String(savedOnly));
      render();
    });

    document.querySelector("#locationButton").addEventListener("click", () => {
      if (!navigator.geolocation) {
        showToast("Location is not available in this browser");
        return;
      }
      showToast("Finding your location...");
      navigator.geolocation.getCurrentPosition(position => {
        origin = { lat: position.coords.latitude, lon: position.coords.longitude };
        document.querySelector("#locationLabel").textContent = "Your location";
        render();
        showToast("Nearby places updated");
      }, () => showToast("Location permission unavailable. Showing San Francisco."), { timeout: 8000, maximumAge: 60000 });
    });

    render();
  </script>
</body>
</html>
